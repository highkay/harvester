# SerpApi-only scan configuration
# Wide GitHub collection + account.json API validation/inspect profile.
# Results are written to ./data/providers/serpapi/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  # ohmygh/gx-inspired transport: edge IP pool, cache, link index, text-match
  github_transport:
    edge_pool:
      enabled: true
      source: auto
      hosts_url: "https://hosts.ohmygh.com/v1/hosts"
      refresh_interval: 3600
      max_edges: 32
      verify: true
      prefer_over_proxy: false
    doh:
      enabled: true
    cache:
      enabled: true
      ttl_search: 60
      ttl_core: 300
      max_entries: 1000
      directory: "cache/github_api"
    index:
      enabled: true
      directory: "cache/search_index"
      # Set true on resume runs to skip gather for already-seen URLs
      skip_known_links: false
    text_match: true
    quota_tracking: true
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  serpapi:
    base_rate: 1.0
    burst_limit: 5
    adaptive: true

tasks:
  - name: serpapi
    enabled: true
    provider_type: serpapi
    use_api: true
    max_pages: 1000
    # Expand recall beyond code blobs (requires use_api: true)
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://serpapi.com
      completion_path: /search.json
      model_path: /account.json
      default_model: serpapi-account
      auth_key: ""
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      # SerpApi keys are prefix-less 32-char hex. Default extraction only
      # captures assignments anchored to SerpApi env names, so raw hex runs
      # (checksums, digests) in matched blobs do not flood the check stage.
      # Domain-anchored conditions override with a wider variadic below.
      key_pattern: >-
        (?i)(?:SERPAPI_API_KEY|SERPAPI_KEY|SERP_API_KEY|serpapi[_-]?(?:api[_-]?key|key))["'\]]{0,2}\s*[:=]\s*["']?([0-9a-fA-F]{32})["']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"SERPAPI_API_KEY"'
      - query: '"SERPAPI_KEY"'
      - query: '"SERP_API_KEY"'
      - query: '"serpapi_key"'
      - query: '"SERPAPI_API_KEY="'
      - query: '"SERPAPI_API_KEY:"'
      - query: '"SERPAPI_KEY="'
      - query: '"SERPAPI_KEY:"'
      - query: '"SERPAPI_API_KEY" language:Python'
      - query: '"SERPAPI_API_KEY" language:JavaScript'
      - query: '"SERPAPI_API_KEY" language:TypeScript'
      - query: '"SERPAPI_API_KEY" language:Go'
      - query: '"SERPAPI_API_KEY" extension:env'
      - query: '"SERPAPI_API_KEY" extension:json'
      - query: '"SERPAPI_API_KEY" extension:yaml'
      - query: '"SERPAPI_API_KEY" extension:yml'
      - query: '"SERPAPI_API_KEY" extension:toml'
      # Domain-anchored blobs: allow plain api_key assignments and the URL form.
      - query: '"serpapi.com" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com" "api_key="'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com/search.json"'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"search.json?api_key="'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com" "SERPAPI"'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com" language:Python'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
      - query: '"serpapi.com" extension:yaml'
        patterns:
          key_pattern: >-
            (?i)(?:(?:serpapi[_-]?(?:api[_-]?key|key)|serp_api_key|api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?|search[.]json[?]api_key=)([0-9a-fA-F]{32})
    rate_limit:
      base_rate: 1.0
      burst_limit: 5
      adaptive: true
    storage:
      directory: ""
      plan: ""