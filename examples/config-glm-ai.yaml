# GLM international (z.ai / bigmodel.ai) scan configuration (task: glm-ai)
# Endpoint: https://api.z.ai/api/paas/v4   (international, z.ai / bigmodel.ai)
# NOTE: the mainland endpoint is a SEPARATE config:
#   glm -> examples/config-glm.yaml                  (open.bigmodel.cn)
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint via a chat-completions probe
# (GET /models exists but is not used for validation).
# Egress (measured 2026-09-21, AFTER switching the harvester container to host
# networking): api.z.ai is directly reachable — 5/6 probes answered (401/200)
# with 1.3-8.6s latency; the Aliyun-GA IPv6 addresses answered while the IPv4
# addresses were blackholed (0/9 via IPv4-pinned probes). Direct is slower and
# flakier than the socks5 rotation (3/3 in ~1.3s), so WATCH wait-check-keys.txt
# after enabling direct here and set use_proxy back to true if the drop is
# material.
# Results are written to ./data-glm-ai/providers/glm-ai/*.txt

global:
  workspace: "./data-glm-ai"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  # Clean start each run: the first run's pool was ~36k links and replaying it
  # (auto_restore: true) would re-gather the whole backlog every day. Old files
  # are still backed up to backup-<ts>/ — only the replay is skipped.
  auto_restore: false
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  glm:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  glm-ai:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: glm-ai
    enabled: true
    provider_type: glm
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      # GET /models exists (auth-enforced) but is not used for validation;
      # validation uses the chat completions probe.
      base_url: https://api.z.ai/api/paas/v4
      completion_path: /chat/completions
      model_path: ""
      # POLICY 2026-09-21: validation must match what the pooled keys must serve.
      # The gpt-load groups only accept glm-5.3-flash-capable keys — free-tier
      # flash-only keys answer 429/1113 ("no resource pack") and are rejected as
      # no-quota, never pushed.
      default_model: glm-5.3-flash
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # z.ai is directly reachable post host-networking (see egress note above)
    patterns:
      key_pattern: "[0-9a-f]{32}\\.[A-Za-z0-9]{16,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # International Zhipu: api.z.ai / bigmodel.ai / z.ai platform keys.
      - query: '"api.z.ai"'
      - query: '"api.z.ai" "Authorization"'
      - query: '"api.z.ai" "api_key"'
      - query: '"ZHIPUAI_API_KEY" "api.z.ai"'
      - query: '"z.ai" "api_key"'
      - query: '"bigmodel.ai" "api_key"'
      - query: '"glm-4" "api.z.ai"'
      - query: '"zhipuai" "api.z.ai"'
      - query: '"api.z.ai" language:Python'
      - query: '"api.z.ai" language:JavaScript'
      - query: '"api.z.ai" extension:env'
      - query: '"api.z.ai" extension:json'
      - query: '"z.ai" extension:yaml'
      - query: '"ZHIPUAI_API_KEY" language:Python "api.z.ai"'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""