# Alibaba ModelScope (魔搭社区)-only scan configuration
# Single CN endpoint (no international variant):
#   modelscope -> https://modelscope.cn/openapi/v1 (hub openapi)
# Keys are ms- prefixed SDK/user tokens, discovered through MODELSCOPE_*
# env-name assignments (no fixed width; floor ms- + 8).
# Validation: GET /users/me with Authorization: Bearer <token> — 401 means
# invalid key (the users/me hub endpoint is auth-gated, unlike the public
# model list).
# Results are written to ./data-modelscope/providers/modelscope/*.txt

global:
  workspace: "./data-modelscope"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  modelscope:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: modelscope
    enabled: true
    provider_type: modelscope
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://modelscope.cn/openapi/v1
      completion_path: /users/me
      model_path: /users/me
      default_model: modelscope-account
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # hub reachable direct from the container
    patterns:
      # ms- SDK/user tokens are extracted only from MODELSCOPE_* env-name
      # assignments; there is no bare [0-9A-Za-z_-]{20,} branch, so raw
      # alnum runs in matched blobs do not flood the check stage.
      # Domain-anchored conditions below widen to Bearer/quoted or oauth2
      # URL extraction.
      key_pattern: >-
        (?i)(?:MODELSCOPE_API_TOKEN|MODELSCOPE_SDK_TOKEN|MODELSCOPE_ACCESS_TOKEN|MODELSCOPE_API_KEY)[\"'\]]{0,2}\s*[:=]\s*[\"']?(ms-[A-Za-z0-9_-]{8,})[\"']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"MODELSCOPE_API_KEY"'
      - query: '"MODELSCOPE_API_KEY="'
      - query: '"MODELSCOPE_API_KEY:"'
      - query: '"MODELSCOPE_SDK_TOKEN"'
      - query: '"MODELSCOPE_SDK_TOKEN="'
      - query: '"MODELSCOPE_SDK_TOKEN:"'
      - query: '"MODELSCOPE_ACCESS_TOKEN"'
      - query: '"MODELSCOPE_API_TOKEN"'
      - query: '"MODELSCOPE_API_KEY" language:Python'
      - query: '"MODELSCOPE_API_KEY" language:JavaScript'
      - query: '"MODELSCOPE_API_KEY" language:TypeScript'
      - query: '"MODELSCOPE_SDK_TOKEN" language:Python'
      - query: '"modelscope" extension:env'
      - query: '"modelscope" extension:yaml'
      - query: '"modelscope" extension:json'
      - query: '"modelscope" extension:toml'
      # Domain-anchored blobs: allow Bearer/quoted ms- keys without the env name.
      - query: '"modelscope.cn" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(ms-[A-Za-z0-9_-]{8,})
      # Git URL oauth2 form: https://oauth2:ms-XXX@modelscope.cn/...
      - query: '"oauth2:" "modelscope.cn"'
        patterns:
          key_pattern: >-
            oauth2:(ms-[A-Za-z0-9_-]{8,})@
      - query: '"api-inference.modelscope.cn"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(ms-[A-Za-z0-9_-]{8,})
      - query: '"api-inference.modelscope.cn" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(ms-[A-Za-z0-9_-]{8,})
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
