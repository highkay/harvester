# Alibaba ModelScope (魔搭社区)-only scan configuration
# Single CN endpoint (no international variant):
#   modelscope -> https://api-inference.modelscope.cn/v1
# Keys have no fixed prefix (MODELSCOPE_API_KEY / MODELSCOPE_SDK_TOKEN env names).
# IMPORTANT: GET /v1/models is PUBLIC (200 even for invalid keys), so keys are
# validated directly with a chat completion probe: 401 -> invalid key;
# 402/429-quota/400-Arrearage -> no-quota-keys.txt.
# Results are written to ./data-modelscope/providers/modelscope/*.txt

global:
  workspace: "./data-modelscope"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  modelscope:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: modelscope
    enabled: true
    provider_type: modelscope
    use_api: true
    max_pages: 1000
    search_types: [code, issues, commits]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api-inference.modelscope.cn/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: Qwen/Qwen3-8B
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      # ModelScope tokens have no fixed prefix; keep the pattern broad and rely
      # on MODELSCOPE_* search conditions + address detection to narrow hits.
      key_pattern: "[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"MODELSCOPE_API_KEY"'
      - query: '"MODELSCOPE_API_KEY="'
      - query: '"MODELSCOPE_API_KEY:"'
      - query: '"MODELSCOPE_SDK_TOKEN"'
      - query: '"MODELSCOPE_SDK_TOKEN="'
      - query: '"MODELSCOPE_TOKEN"'
      - query: '"api-inference.modelscope.cn"'
      - query: '"api-inference.modelscope.cn" "Authorization"'
      - query: '"api-inference.modelscope.cn" "api_key"'
      - query: '"modelscope.cn" "api_key"'
      - query: '"MODELSCOPE_ACCESS_TOKEN"'
      - query: '"MODELSCOPE_API_KEY" language:Python'
      - query: '"MODELSCOPE_API_KEY" language:JavaScript'
      - query: '"MODELSCOPE_SDK_TOKEN" language:Python'
      - query: '"modelscope" extension:env'
      - query: '"modelscope" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
