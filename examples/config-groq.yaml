# Groq-only scan configuration
# Results are written to ./data/providers/groq/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  groq:
    base_rate: 2.0
    burst_limit: 10
    adaptive: true

tasks:
  - name: groq
    enabled: true
    provider_type: groq
    use_api: true
    max_pages: 200
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.groq.com/openai/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: llama-3.3-70b-versatile
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      # Real Groq keys are gsk_ + alphanumerics (docs); measured live keys are
      # scarce, so length stays 20+ (length-independent — the serpapi lesson:
      # a fixed/narrow length silently drops every real key). Exclusions:
      #   - WGdy lookahead: honeypot decoys embed base64("XgroqX") == "WGdyb3FY";
      #   - marker words / sequential placeholders / 4-char runs: the 2026-09-06
      #     prod audit found the whole candidate pool was doc placeholders
      #     (gsk_abc123…, gsk_xxxx…, gsk_test…, gsk_AAAA…); these lookaheads
      #     cut them at extraction time (they cost check-stage quota);
      #   - alnum-only charset still drops GTK gsk_* symbols.
      key_pattern: 'gsk_(?!.*WGdy)(?!.*(?i:test|secret|example|demo|fake|dummy|sample|placeholder|keyhere|yourkey|localhost))(?!.*(?:abc123|xyz456|def789|ghi012|jkl345|mno678|pqr901|stu234|vwx567|1234567890|abcdefghijklmnopqrstuvwxyz|abcdefgh))(?!.*(?:X{4,}|x{4,}|A{4,}|a{4,}|B{4,}|0{4,}|9{4,}))[A-Za-z0-9]{20,}'
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      # auto_restore=false means every run searches fresh; the created: window
      # biases toward recently-created repos (2026-09-06 addition).
      - query: '"gsk_"'
      - query: '"GROQ_API_KEY"'
      - query: '"GROQ_API_KEY="'
      - query: '"GROQ_API_KEY:"'
      - query: '"api.groq.com"'
      - query: '"api.groq.com" "Authorization"'
      - query: '"gsk_" created:>=2026-08-01'
    rate_limit:
      base_rate: 2.0
      burst_limit: 10
      adaptive: true
    storage:
      directory: ""
      plan: ""
