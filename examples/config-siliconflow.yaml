# SiliconFlow scan configuration (task: siliconflow)
# Endpoint: https://api.siliconflow.cn/v1   (mainland China, direct connect)
# Validation is a minimal chat completion against the default model below; an
# unknown/withdrawn model id answers 404 or 400 code 20012 and is classified
# NO_MODEL -> wait-check, never INVALID_KEY.
# Results are written to ./data-siliconflow/providers/siliconflow/*.txt

global:
  workspace: "./data-siliconflow"
  max_retries_requeued: 3
  # Per-run corpus bound (house rule since the 2026-10-24 wave).
  max_links_per_run: 9000
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  siliconflow:
    # Hardened-provider pace: 0.2 req/s = 5 s/key.
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: siliconflow
    enabled: true
    provider_type: siliconflow
    use_api: true
    # Pagination depth left at 1000 (inert: `_max_pages()` clamps to
    # API_MAX_PAGES=10); the corpus is bounded by global.max_links_per_run.
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.siliconflow.cn
      completion_path: /v1/chat/completions
      model_path: /v1/models
      # UNVERIFIED probe id: wave-0 (2026-10-29) could not read the free-model
      # list (the model plaza is login-walled) and no live key was available.
      # The pilot run must confirm this id against a real key's /v1/models
      # catalog; a wrong id answers 404 / 400 code 20012 -> NO_MODEL
      # (wait-check), so a stale id costs re-checks, never key discards.
      default_model: Qwen/Qwen2.5-7B-Instruct
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      # Key format MEASURED 2026-10-29 over SILICONFLOW_API_KEY /
      # api.siliconflow.cn / "siliconflow" "sk-" fragments: `sk-` + 48 chars,
      # lowercase alnum (11 of 12 non-placeholder hits were 48 lowercase
      # letters, 1 carried digits; a 20-char dummy and hyphenated placeholders
      # were excluded). Floor 32, NO upper bound (serpapi lesson: a fixed
      # width silently drops keys when the provider rotates formats).
      # The task-level pattern only fires on env-name assignments.
      key_pattern: >-
        (?i)(?:siliconflow[_-]?(?:api[_-]?)?key)["'\]]{0,2}\s*[:=]\s*["']?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})["']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"SILICONFLOW_API_KEY"'
      - query: '"SILICONFLOW_API_KEY="'
      - query: '"SILICONFLOW_API_KEY:"'
      - query: '"siliconflow_api_key"'
      # Domain-anchored blobs: allow Bearer/quoted sk- keys without the env
      # name (the measured real hits sit in yaml/python config blocks).
      - query: '"api.siliconflow.cn"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
      - query: '"api.siliconflow.cn" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
      - query: '"siliconflow" "sk-"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
      - query: '"SILICONFLOW_API_KEY" language:Python'
      - query: '"api.siliconflow.cn" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
      - query: '"siliconflow" extension:yaml'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
      - query: '"siliconflow" extension:json'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:your|test|dummy|example|placeholder|changeme|xxx|fake|sample))[A-Za-z0-9]{32,})
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""