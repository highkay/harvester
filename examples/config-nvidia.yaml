# NVIDIA NIM-only scan configuration
# Wide GitHub collection profile: search/gather only by default.
# Enable check/inspect only when you want slow API validation.
# Results are written to ./data-nvidia-wide/providers/nvidia/*.txt

global:
  workspace: "./data-nvidia-wide"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 1
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  nvidia:
    base_rate: 0.1
    burst_limit: 1
    adaptive: true

tasks:
  - name: nvidia
    enabled: true
    provider_type: openai_like
    use_api: true
    max_pages: 1000
    stages:
      search: true
      gather: true
      check: false
      inspect: false
    api:
      base_url: https://integrate.api.nvidia.com/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: meta/llama-3.3-70b-instruct
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      key_pattern: "nvapi-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"nvapi-"'
      - query: '"NVIDIA_API_KEY"'
      - query: '"NVIDIA_API_KEY="'
      - query: '"NVIDIA_API_KEY:"'
      - query: '"NVIDIA_API_KEY" "nvapi-"'
      - query: '"integrate.api.nvidia.com/v1"'
      - query: '"integrate.api.nvidia.com/v1" "Authorization"'
      - query: '"integrate.api.nvidia.com/v1" "api_key"'
      - query: '"nvapi-" "integrate.api.nvidia.com"'
      - query: '"nvapi-" "Authorization"'
      - query: '"nvapi-" "base_url"'
      - query: '"nvapi-" "OpenAI"'
      - query: '"nvapi-" language:Python'
      - query: '"nvapi-" language:JavaScript'
      - query: '"nvapi-" language:TypeScript'
      - query: '"nvapi-" language:Go'
      - query: '"nvapi-" language:Java'
      - query: '"nvapi-" language:Shell'
      - query: '"nvapi-" extension:env'
      - query: '"nvapi-" extension:json'
      - query: '"nvapi-" extension:yaml'
      - query: '"nvapi-" extension:yml'
      - query: '"nvapi-" extension:toml'
      - query: '"nvapi-" extension:md'
    rate_limit:
      base_rate: 0.1
      burst_limit: 1
      adaptive: true
    storage:
      directory: ""
      plan: ""
