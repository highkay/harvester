# Ollama Cloud scan configuration - 10000 results target
# Results are written to ./data-ollama/providers/ollama/*.txt

global:
  workspace: "./data-ollama"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions: []
    tokens:
      - "your_github_token_here"
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 8
    check: 4
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 5.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 10
  save_interval: 10
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  ollama:
    base_rate: 5.0
    burst_limit: 20
    adaptive: true

tasks:
  - name: ollama
    enabled: true
    provider_type: ollama
    use_api: true
    max_pages: 100
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://ollama.com/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: gpt-oss:20b
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      key_pattern: "(?i)(?:OLLAMA_API_KEY|ollama[_-]?key)\\s*[:=]\\s*[\"']?([0-9A-Za-z._~+/=-]{20,})[\"']?"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      - query: '"OLLAMA_API_KEY"'
      - query: '"ollama.com/v1" "api_key"'
      - query: '"ollama" "api_key" extension:env'
      - query: '"ollama.com" "Bearer" extension:py'
      - query: '"OLLAMA_API_KEY" extension:yaml'
      - query: '"ollama" "api_key" extension:toml'
      - query: '"ollama.com/v1" extension:json'
      - query: '"OLLAMA_API_KEY" extension:sh'
    rate_limit:
      base_rate: 5.0
      burst_limit: 20
      adaptive: true
    storage:
      directory: ""
      plan: ""
