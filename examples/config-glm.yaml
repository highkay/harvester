# GLM (Zhipu AI / BigModel) — mainland China scan configuration (task: glm)
# Endpoint: https://open.bigmodel.cn/api/paas/v4   (platform.bigmodel.cn)
# NOTE: the international z.ai endpoint is a SEPARATE config now:
#   glm-ai -> examples/config-glm-ai.yaml            (api.z.ai, needs outbound proxy)
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint via a chat-completions probe
# (GET /models exists but is not used for validation).
# Results are written to ./data-glm/providers/glm/*.txt

global:
  workspace: "./data-glm"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  # Clean start each run: the first run's pool was ~60k links and replaying it
  # (auto_restore: true) would re-gather the whole backlog every day. Old files
  # are still backed up to backup-<ts>/ — only the replay is skipped.
  auto_restore: false
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  glm:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  glm-ai:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: glm
    enabled: true
    provider_type: glm
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      # GET /models exists (auth-enforced) but is not used for validation;
      # validation uses the chat completions probe.
      base_url: https://open.bigmodel.cn/api/paas/v4
      completion_path: /chat/completions
      model_path: ""
      # MEASURED 2026-09-21: glm-4.5-flash is the least congested flash model
      # (10/10 200s on this endpoint) — glm-4.7-flash is heavily congested
      # (mostly 429 code 1305) and non-flash models answer 1113 "no resource
      # pack" for these free-tier keys.
      default_model: glm-4.5-flash
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      key_pattern: "[0-9a-f]{32}\\.[A-Za-z0-9]{16,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"ZHIPUAI_API_KEY"'
      - query: '"ZHIPUAI_API_KEY="'
      - query: '"ZHIPUAI_API_KEY:"'
      - query: '"open.bigmodel.cn"'
      - query: '"bigmodel.cn"'
      - query: '"open.bigmodel.cn" "Authorization"'
      - query: '"open.bigmodel.cn" "api_key"'
      - query: '"zhipuai" "api_key"'
      - query: '"glm-4" "api_key"'
      - query: '"chatglm" "api_key"'
      - query: '"ZHIPUAI_API_KEY" language:Python'
      - query: '"open.bigmodel.cn" language:JavaScript'
      - query: '"open.bigmodel.cn" extension:env'
      - query: '"bigmodel.cn" extension:json'
      - query: '"zhipuai" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""