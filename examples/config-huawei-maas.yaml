# Huawei ModelArts MaaS scan configuration (task: huawei-maas)
# Endpoint: https://api.modelarts-maas.com/openai/v1   (mainland China, direct connect)
#
# UNSCHEDULED (degraded path, plan todo 7): wave-0 (2026-10-29) confirmed the
# auth gate (no key -> 400 ModelArts.81002, bad key -> 401 ModelArts.81003)
# but the corpus anchors are polluted — MAAS_API_KEY mostly matches Canonical
# Ubuntu MAAS (OAuth1 triples) and iFlytek Spark MaaS, and the domain-anchored
# sample showed zero real key literals — so the key shape is UNDETERMINED and
# free quota is UNVERIFIED. No scheduler seed row until a pilot proves supply.
#
# Validation is a minimal chat completion against the default model below;
# an unknown/withdrawn model id answers 404 -> NO_MODEL (wait-check), never
# INVALID_KEY.
# Results are written to ./data-huawei-maas/providers/huawei-maas/*.txt

global:
  workspace: "./data-huawei-maas"
  max_retries_requeued: 3
  # Per-run corpus bound (house rule since the 2026-10-24 wave).
  max_links_per_run: 9000
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  huawei-maas:
    # Hardened-provider pace: 0.2 req/s = 5 s/key.
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: huawei-maas
    enabled: true
    provider_type: huawei-maas
    use_api: true
    # Pagination depth left at 1000 (inert: `_max_pages()` clamps to
    # API_MAX_PAGES=10); the corpus is bounded by global.max_links_per_run.
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.modelarts-maas.com/openai/v1
      completion_path: /chat/completions
      model_path: /models
      # UNVERIFIED probe id: wave-0 confirmed the gate but no real key was
      # available to list /models. The pilot run must confirm this id against
      # a live key's catalog; a wrong id answers 404 -> NO_MODEL (wait-check),
      # so a stale id costs re-checks, never key discards.
      default_model: DeepSeek-V3.1
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      # Key shape UNDETERMINED (wave-0 2026-10-29: three anchors x 10 samples
      # carried zero real key literals), so extraction is env-anchored with a
      # WIDE body class and a placeholder guard; the domain anchor
      # (api.modelarts-maas.com) is the real filter (host-named-dork
      # precedent). Lockstep with the config/defaults.py huawei-maas preset.
      key_pattern: >-
        (?i)(?:huawei[_-]?maas[_-]?(?:api[_-]?)?key|maas[_-]?api[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?((?!your[_-])[A-Za-z0-9_\-]{20,})["']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # NOTE: "MAAS_API_KEY" alone is polluted (Ubuntu MAAS / iFlytek MaaS);
      # the huawei-qualified queries below narrow it. The domain-anchored
      # queries carry the wide override pattern.
      - query: '"MAAS_API_KEY" "modelarts"'
      - query: '"MAAS_API_KEY" "modelarts-maas"'
      - query: '"HUAWEI_MAAS_API_KEY"'
      - query: '"api.modelarts-maas.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?((?!your[_-])[A-Za-z0-9_\-]{20,})
      - query: '"api.modelarts-maas.com" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?((?!your[_-])[A-Za-z0-9_\-]{20,})
      - query: '"MAAS_API_KEY" "modelarts-maas" extension:env'
      - query: '"api.modelarts-maas.com" extension:yaml'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?((?!your[_-])[A-Za-z0-9_\-]{20,})
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
