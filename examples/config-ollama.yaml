# Ollama Cloud scan configuration
# Results are written to ./data/providers/ollama/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions: []
    tokens:
      - "your_github_token_here"
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  ollama:
    base_rate: 2.0
    burst_limit: 10
    adaptive: true

tasks:
  - name: ollama
    enabled: true
    provider_type: ollama
    use_api: true
    max_pages: 1000
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://ollama.com/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: gpt-oss:20b
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      # Capture tightened to the measured key shape <32 lowercase hex>.<16+
      # body incl. _/- (2026-10-19, whole-corpus: 54/54 valid kept, materials
      # -84.7%). Floor-only: no ceiling, per the serpapi fixed-width lesson.
      key_pattern: "(?i)(?:OLLAMA_API_KEY|ollama[_-]?key)\\s*[:=]\\s*[\"']?([0-9a-f]{32}\\.[A-Za-z0-9_-]{16,})[\"']?"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      - query: '"OLLAMA_API_KEY"'
      - query: '"ollama.com/v1" "api_key"'
      # The token form `"ollama" "api_key"` matches mostly code that *references*
      # the env var; it is also oversized (>1000 results), so its refine partitions
      # are all `language:` variants of a file-type query and return ~0 — measured
      # 2026-09-22: 3144 results, only page 1 ever walked, 0 new keys. The phrase
      # form below targets the files that actually assign a key and stays under the
      # 1000-result cap, so pages 2..5 walk the whole class.
      - query: '"OLLAMA_API_KEY" extension:env'
      # Size triplets fully walk this dense class (455-500 results, 26/100
      # keys) whose language: refine partitions are 100% zero-result
      # (extension:-qualified dorks cannot be language-partitioned).
      - query: '"OLLAMA_API_KEY" extension:env size:1..1000'
      - query: '"OLLAMA_API_KEY" extension:env size:1000..10000'
      - query: '"OLLAMA_API_KEY" extension:env size:>10000'
    rate_limit:
      base_rate: 2.0
      burst_limit: 10
      adaptive: true
    storage:
      directory: ""
      plan: ""
