# DeepSeek-only scan configuration
# Wide GitHub collection + API validation/inspect profile.
# Results are written to ./data-deepseek/providers/deepseek/*.txt

global:
  workspace: "./data-deepseek"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  deepseek:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: deepseek
    enabled: true
    provider_type: deepseek
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.deepseek.com
      completion_path: /chat/completions
      model_path: /models
      default_model: deepseek-v4-flash
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      key_pattern: "sk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"DEEPSEEK_API_KEY"'
      - query: '"DEEPSEEK_API_KEY="'
      - query: '"DEEPSEEK_API_KEY:"'
      - query: '"api.deepseek.com"'
      - query: '"api.deepseek.com" "Authorization"'
      - query: '"api.deepseek.com" "api_key"'
      - query: '"deepseek-chat"'
      - query: '"deepseek" "api_key"'
      - query: '"sk-" "api.deepseek.com"'
      - query: '"deepseek" language:Python'
      - query: '"DEEPSEEK_API_KEY" language:Python'
      - query: '"api.deepseek.com" language:JavaScript'
      - query: '"api.deepseek.com" extension:env'
      - query: '"api.deepseek.com" extension:json'
      - query: '"deepseek" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
