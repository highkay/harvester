# DeepSeek-only scan configuration
# Wide GitHub collection + API validation/inspect profile.
# Results are written to ./data-deepseek/providers/deepseek/*.txt

global:
  workspace: "./data-deepseek"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  deepseek:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: deepseek
    enabled: true
    provider_type: deepseek
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.deepseek.com
      completion_path: /chat/completions
      model_path: /models
      default_model: deepseek-v4-flash
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      # Real DeepSeek format MEASURED `sk-` + 32 hex (n=401 authentic, prod
      # 2026-09-22). The former naked sk- pattern made every sk- run on any
      # fetched page a check candidate: measured 2572 invalid/run (sk-ant-
      # 186, sk-or-… and other vendors) vs 477 authentic keys. Format alone
      # cannot separate DeepSeek from other sk- vendors, so the task-level
      # pattern only fires on DEEPSEEK_* env-name assignments; domain-named
      # conditions override with a Bearer/quoted variadic below. The lookahead
      # skips Anthropic / OpenAI project / service-account keys. No upper
      # bound on the body: a fixed width silently drops keys if the provider
      # rotates the format (serpapi lesson) — 32-hex is documented, not
      # enforced.
      key_pattern: >-
        (?i)(?:deepseek[_-]?(?:api[_-]?)?key|DEEPSEEK_KEY)[\"'\]]{0,2}\s*[:=]\s*[\"']?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})[\"']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      # Env-name dorks inherit the narrow task pattern above.
      - query: '"DEEPSEEK_API_KEY"'
      - query: '"DEEPSEEK_API_KEY="'
      - query: '"DEEPSEEK_API_KEY:"'
      # Domain-anchored blobs: allow Bearer/quoted sk- keys without the env name.
      - query: '"api.deepseek.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.deepseek.com" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.deepseek.com" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"deepseek-chat"'
      - query: '"deepseek" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"sk-" "api.deepseek.com"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"deepseek" language:Python'
      - query: '"DEEPSEEK_API_KEY" language:Python'
      - query: '"api.deepseek.com" language:JavaScript'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.deepseek.com" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.deepseek.com" extension:json'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|[\"']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"deepseek" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
