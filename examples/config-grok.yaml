# Grok/xAI-only scan configuration
# Searches GitHub for xai- API keys and validates them via GET /v1/models.
# Grok web/SSO session tokens are intentionally NOT scanned: the provider
# routes them to wait-check (browser-context manual verification), so they
# can never land in valid-keys.txt.
# Results are written to ./data/providers/grok/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  # ohmygh/gx-inspired transport: edge IP pool, cache, link index, text-match
  github_transport:
    edge_pool:
      enabled: true
      source: auto
      hosts_url: "https://hosts.ohmygh.com/v1/hosts"
      refresh_interval: 3600
      max_edges: 32
      verify: true
      prefer_over_proxy: false
    doh:
      enabled: true
    cache:
      enabled: true
      ttl_search: 60
      ttl_core: 300
      max_entries: 1000
      directory: "cache/github_api"
    index:
      enabled: true
      directory: "cache/search_index"
      # Set true on resume runs to skip gather for already-seen URLs
      skip_known_links: false
    text_match: true
    quota_tracking: true
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  grok:
    base_rate: 1.0
    burst_limit: 5
    adaptive: true

tasks:
  - name: grok
    enabled: true
    provider_type: grok
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.x.ai/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: grok-4
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      key_pattern: "xai-[0-9A-Za-z_-]{32,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"XAI_API_KEY"'
      - query: '"XAI_API_KEY="'
      - query: '"XAI_API_KEY:"'
      - query: '"xai-"'
      - query: '"api.x.ai"'
      - query: '"api.x.ai" "Authorization"'
      - query: '"api.x.ai" "api_key"'
      - query: '"grok-4"'
      - query: '"grok-beta"'
      - query: '"xai" "api_key"'
      - query: '"xai" language:Python'
      - query: '"api.x.ai" extension:env'
      - query: '"XAI_API_KEY" language:Python'
    rate_limit:
      base_rate: 1.0
      burst_limit: 5
      adaptive: true
    storage:
      directory: ""
      plan: ""
