# Brave-only scan configuration
# Wide GitHub collection + zero-cost probe validation/inspect profile.
# Results are written to ./data/providers/brave/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  # ohmygh/gx-inspired transport: edge IP pool, cache, link index, text-match
  github_transport:
    edge_pool:
      enabled: true
      source: auto
      hosts_url: "https://hosts.ohmygh.com/v1/hosts"
      refresh_interval: 3600
      max_edges: 32
      verify: true
      prefer_over_proxy: false
    doh:
      enabled: true
    cache:
      enabled: true
      ttl_search: 60
      ttl_core: 300
      max_entries: 1000
      directory: "cache/github_api"
    index:
      enabled: true
      directory: "cache/search_index"
      # Set true on resume runs to skip gather for already-seen URLs
      skip_known_links: false
    text_match: true
    quota_tracking: true
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  brave:
    # Hardened-provider pace (tavily/kimi lineage): 0.2 req/s = 5 s/key.
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: brave
    enabled: true
    provider_type: brave
    use_api: true
    max_pages: 1000
    # Expand recall beyond code blobs (requires use_api: true)
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.search.brave.com
      completion_path: /res/v1/web/search
      model_path: /res/v1/web/search
      default_model: brave-search
      auth_key: X-Subscription-Token
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      # Env-anchored extraction only: no width ceiling and no prefix
      # assumption (BSA prefix unverified - measured corpus first, then
      # align). Domain/header dorks override with a wider pattern below.
      key_pattern: >-
        (?i)(?:brave[_-]?(?:search[_-]?)?api[_-]?key|brave[_-]?(?:subscription[_-]?)?token)["'\]]{0,2}\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})["']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"BRAVE_API_KEY"'
      - query: '"BRAVE_SEARCH_API_KEY"'
      # Domain/header-anchored blobs: allow the token-header forms a plain
      # assignment anchor would miss.
      - query: '"api.search.brave.com"'
        patterns:
          key_pattern: >-
            (?i)(?:X-Subscription-Token["'\s:]*|Bearer\s+|["']\s*)(?!x-subscription-token)([A-Za-z0-9_\-]{20,})
      - query: '"X-Subscription-Token" "brave"'
        patterns:
          key_pattern: >-
            (?i)(?:X-Subscription-Token["'\s:]*|Bearer\s+|["']\s*)(?!x-subscription-token)([A-Za-z0-9_\-]{20,})
      - query: '"brave" "subscription token" extension:env'
    rate_limit:
      # Same measured pace as ratelimits.brave above: 0.2 req/s = 5 s/key.
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
