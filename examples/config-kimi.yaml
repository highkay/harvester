# Kimi (Moonshot AI)-only scan configuration
# Three regional endpoints, one task each:
#   kimi        -> https://api.moonshot.cn/v1        (mainland China, platform.moonshot.cn)
#   kimi-coding -> https://api.kimi.com/coding/v1    (Kimi for Coding / subscription plan, platform.kimi.com)
#   kimi-ai     -> https://api.moonshot.ai/v1        (international open platform, platform.kimi.ai / kimi.ai)
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: each task validates keys against its own endpoint's GET /models,
# then probes a minimal chat completion to surface 402 (zero-balance keys are
# filtered to no-quota-keys.txt instead of being marked valid).
# Results are written to ./data-kimi/providers/<task>/*.txt

global:
  workspace: "./data-kimi"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  kimi:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-coding:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-ai:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  # ============ Mainland China endpoint: api.moonshot.cn/v1 ============
  - name: kimi
    enabled: true
    provider_type: kimi
    use_api: true
    max_pages: 1000
    search_types: [code, issues, commits]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.moonshot.cn/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: kimi-k3
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      key_pattern: "sk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"MOONSHOT_API_KEY"'
      - query: '"MOONSHOT_API_KEY="'
      - query: '"MOONSHOT_API_KEY:"'
      - query: '"api.moonshot.cn"'
      - query: '"api.moonshot.cn" "Authorization"'
      - query: '"api.moonshot.cn" "api_key"'
      - query: '"moonshot" "api_key"'
      - query: '"kimi" "api_key"'
      - query: '"sk-" "api.moonshot.cn"'
      - query: '"MOONSHOT_API_KEY" language:Python'
      - query: '"api.moonshot.cn" language:JavaScript'
      - query: '"api.moonshot.cn" extension:env'
      - query: '"api.moonshot.cn" extension:json'
      - query: '"moonshot" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""

  # ============ Kimi for Coding / subscription: api.kimi.com/coding/v1 ============
  - name: kimi-coding
    enabled: true
    provider_type: kimi
    use_api: true
    max_pages: 1000
    search_types: [code, issues, commits]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.kimi.com/coding/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: kimi-k3
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      key_pattern: "sk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Kimi for Coding (Claude Code / IDE) subscription keys: platform.kimi.com
      - query: '"api.kimi.com"'
      - query: '"api.kimi.com" "Authorization"'
      - query: '"api.kimi.com" "api_key"'
      - query: '"kimi.com/coding"'
      - query: '"coding/v1" "kimi"'
      - query: '"KIMI_CODING_API_KEY"'
      - query: '"KIMI_API_KEY" "coding"'
      - query: '"sk-" "api.kimi.com"'
      - query: '"api.kimi.com" language:Python'
      - query: '"api.kimi.com" language:JavaScript'
      - query: '"api.kimi.com" extension:env'
      - query: '"api.kimi.com" extension:json'
      - query: '"api.kimi.com" extension:yaml'
      - query: '"platform.kimi.com" "api_key"'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""

  # ============ International open platform: api.moonshot.ai/v1 ============
  - name: kimi-ai
    enabled: true
    provider_type: kimi
    use_api: true
    max_pages: 1000
    search_types: [code, issues, commits]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.moonshot.ai/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: kimi-k3
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: true  # international endpoint — route through proxy
    patterns:
      key_pattern: "sk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # International open platform (platform.kimi.ai / kimi.ai): api.moonshot.ai
      - query: '"api.moonshot.ai"'
      - query: '"api.moonshot.ai" "Authorization"'
      - query: '"api.moonshot.ai" "api_key"'
      - query: '"MOONSHOT_API_KEY" "api.moonshot.ai"'
      - query: '"platform.kimi.ai"'
      - query: '"moonshot.ai" "api_key"'
      - query: '"kimi.ai" "api_key"'
      - query: '"sk-" "api.moonshot.ai"'
      - query: '"api.moonshot.ai" language:Python'
      - query: '"api.moonshot.ai" language:JavaScript'
      - query: '"api.moonshot.ai" extension:env'
      - query: '"api.moonshot.ai" extension:json'
      - query: '"api.moonshot.ai" extension:yaml'
      - query: '"MOONSHOT_API_KEY" language:Python "api.moonshot.ai"'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
