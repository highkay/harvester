# Kimi (Moonshot AI) — mainland China scan configuration (task: kimi)
# Endpoint: https://api.moonshot.cn/v1   (platform.moonshot.cn)
# NOTE: the other two regional tasks are SEPARATE configs now:
#   kimi-coding -> examples/config-kimi-coding.yaml   (api.kimi.com/coding/v1)
#   kimi-ai     -> examples/config-kimi-ai.yaml       (api.moonshot.ai/v1)
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint's GET /models, then probes a
# minimal chat completion to surface 402 (zero-balance keys are filtered to
# no-quota-keys.txt instead of being marked valid).
# Results are written to ./data-kimi/providers/kimi/*.txt

global:
  workspace: "./data-kimi"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 50  # flush every 50 items (or save_interval seconds); 1 = a write+log per item
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  kimi:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-coding:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-ai:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: kimi
    enabled: true
    provider_type: kimi
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.moonshot.cn/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: kimi-k3
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      # Moonshot platform keys are sk- + 48 alnum. MEASURED 2026-09-22 (prod):
      # 229/229 authentic kimi no-quota keys (and 15/15 kimi-ai) had body_len
      # 48, alnum, mixed case + digits. Format alone cannot separate them from
      # other sk- providers, so the task-level pattern only fires on
      # Moonshot/Kimi env-name assignments; domain-named conditions override
      # with a Bearer/quoted variadic below. The lookahead skips Anthropic /
      # OpenAI project / service-account keys. No upper bound on the body: a
      # fixed width silently drops keys if the provider rotates the format
      # (serpapi lesson).
      key_pattern: >-
        (?i)(?:moonshot[_-]?(?:ai[_-]?)?api[_-]?key|kimi[_-]?(?:ai[_-]?)?api[_-]?key|moonshot[_-]?key)["'\]]{0,2}\s*[:=]\s*["']?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})["']?
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      # Env-name dorks inherit the narrow task pattern above.
      - query: '"MOONSHOT_API_KEY"'
      - query: '"MOONSHOT_API_KEY="'
      - query: '"MOONSHOT_API_KEY:"'
      # Domain-anchored blobs: allow Bearer/quoted sk- keys without the env name.
      - query: '"api.moonshot.cn"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.moonshot.cn" "Authorization"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.moonshot.cn" "api_key"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"moonshot" "api_key"'
      - query: '"kimi" "api_key"'
      - query: '"sk-" "api.moonshot.cn"'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"MOONSHOT_API_KEY" language:Python'
      - query: '"api.moonshot.cn" language:JavaScript'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.moonshot.cn" extension:env'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"api.moonshot.cn" extension:json'
        patterns:
          key_pattern: >-
            (?i)(?:Bearer\s+|["']\s*)?(sk-(?!(?:ant|proj|svcacct)-)[A-Za-z0-9]{16,})
      - query: '"moonshot" extension:yaml'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
