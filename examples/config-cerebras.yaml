# Cerebras-only scan configuration
# Results are written to ./data/providers/cerebras/*.txt

global:
  workspace: "./data"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  cerebras:
    base_rate: 1.0
    burst_limit: 5
    adaptive: true

tasks:
  - name: cerebras
    enabled: true
    provider_type: cerebras
    use_api: true
    max_pages: 1000
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.cerebras.ai/v1
      completion_path: /chat/completions
      model_path: /models
      default_model: gpt-oss-120b
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      key_pattern: "csk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      - query: '"csk-"'
    rate_limit:
      base_rate: 1.0
      burst_limit: 5
      adaptive: true
    storage:
      directory: ""
      plan: ""
