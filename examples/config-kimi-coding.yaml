# Kimi for Coding (subscription plan) scan configuration (task: kimi-coding)
# Endpoint: https://api.kimi.com/coding/v1   (Kimi Code / coding subscription, platform.kimi.com)
# NOTE: the other two regional tasks are SEPARATE configs:
#   kimi -> examples/config-kimi.yaml                 (api.moonshot.cn/v1)
#   kimi-ai -> examples/config-kimi-ai.yaml           (api.moonshot.ai/v1)
# Upstream: per-endpoint GitHub search conditions (top 1000 results per query).
# Downstream: validates keys against this endpoint's GET /models, then probes a
# minimal chat completion.
# Subscription semantics (measured): keys from accounts WITHOUT an active Kimi
# Code subscription are rejected with 403 "Your current subscription does not
# have access to Kimi Code right now" and are classified NO_ACCESS (they are
# NOT valid for this endpoint); 401 means the key itself is invalid/expired.
# Results are written to ./data-kimi-coding/providers/kimi-coding/*.txt

global:
  workspace: "./data-kimi-coding"
  max_retries_requeued: 3
  proxy: ""
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: false  # clean start (replay ratchets the corpus)
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  kimi:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-coding:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true
  kimi-ai:
    base_rate: 0.2
    burst_limit: 2
    adaptive: true

tasks:
  - name: kimi-coding
    enabled: true
    provider_type: kimi
    use_api: true
    max_pages: 1000
    search_types: [code]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.kimi.com/coding/v1
      completion_path: /chat/completions
      model_path: /models
      # MEASURED 2026-09-21: GET /models on this endpoint lists ONLY
      # kimi-for-coding, kimi-for-coding-highspeed, k3, k3-256k.
      # kimi-k3 is an Open-Platform (api.moonshot.cn) model id and is NOT valid
      # here — probing with it makes a live key look invalid.
      default_model: kimi-for-coding
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
      use_proxy: false  # domestic endpoint — connect directly
    patterns:
      key_pattern: "sk-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Kimi for Coding (Claude Code / IDE) subscription keys: platform.kimi.com
      - query: '"api.kimi.com"'
      - query: '"api.kimi.com" "Authorization"'
      - query: '"api.kimi.com" "api_key"'
      - query: '"kimi.com/coding"'
      - query: '"coding/v1" "kimi"'
      - query: '"KIMI_CODING_API_KEY"'
      - query: '"KIMI_API_KEY" "coding"'
      - query: '"sk-" "api.kimi.com"'
      - query: '"api.kimi.com" language:Python'
      - query: '"api.kimi.com" language:JavaScript'
      - query: '"api.kimi.com" extension:env'
      - query: '"api.kimi.com" extension:json'
      - query: '"api.kimi.com" extension:yaml'
      - query: '"platform.kimi.com" "api_key"'
    rate_limit:
      base_rate: 0.2
      burst_limit: 2
      adaptive: true
    storage:
      directory: ""
      plan: ""
