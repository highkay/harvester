# Tavily-only scan configuration
# Wide GitHub collection + API validation/inspect profile.
# Results are written to ./data-tavily/providers/tavily/*.txt

global:
  workspace: "./data-tavily"
  max_retries_requeued: 3
  proxy: ""
  # ohmygh/gx-inspired transport: edge IP pool, cache, link index, text-match
  github_transport:
    edge_pool:
      enabled: true
      source: auto
      hosts_url: "https://hosts.ohmygh.com/v1/hosts"
      refresh_interval: 3600
      max_edges: 32
      verify: true
      prefer_over_proxy: false
    doh:
      enabled: true
    cache:
      enabled: true
      ttl_search: 60
      ttl_core: 300
      max_entries: 1000
      directory: "cache/github_api"
    index:
      enabled: true
      directory: "cache/search_index"
      # Set true on resume runs to skip gather for already-seen URLs
      skip_known_links: false
    text_match: true
    quota_tracking: true
  github_credentials:
    sessions:
      - "your_github_session_here"
    tokens:
      - "your_github_token_here"
    strategy: "round_robin"
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

pipeline:
  threads:
    search: 1
    gather: 4
    check: 2
    inspect: 1
  queue_sizes:
    search: 100000
    gather: 200000
    check: 500000
    inspect: 1000000

monitoring:
  update_interval: 2.0
  error_threshold: 0.1
  queue_threshold: 1000000
  memory_threshold: 1073741824
  response_threshold: 5.0

persistence:
  batch_size: 1
  save_interval: 5
  queue_interval: 60
  snapshot_interval: 300
  auto_restore: true
  shutdown_timeout: 30
  format: txt

ratelimits:
  github_api:
    base_rate: 0.15
    burst_limit: 3
    adaptive: true
  tavily:
    base_rate: 1.0
    burst_limit: 5
    adaptive: true

tasks:
  - name: tavily
    enabled: true
    provider_type: tavily
    use_api: true
    max_pages: 1000
    # Expand recall beyond code blobs (requires use_api: true)
    search_types: [code, issues, commits]
    stages:
      search: true
      gather: true
      check: true
      inspect: true
    api:
      base_url: https://api.tavily.com
      completion_path: /search
      model_path: /usage
      default_model: tavily-search
      auth_key: Authorization
      extra_headers: {}
      api_version: ""
      timeout: 30
      retries: 3
    patterns:
      key_pattern: "(?:tvly|tavily)-[0-9A-Za-z_-]{20,}"
      address_pattern: ""
      endpoint_pattern: ""
      model_pattern: ""
    conditions:
      # Each GitHub API search query has its own 1000-result window.
      - query: '"tvly-"'
      - query: '"tavily-"'
      - query: '"tvly-dev-"'
      - query: '"tvly-prod-"'
      - query: '"TAVILY_API_KEY"'
      - query: '"TAVILY_API_KEY="'
      - query: '"TAVILY_API_KEY:"'
      - query: '"TAVILY_API_KEY" "tvly-"'
      - query: '"api.tavily.com"'
      - query: '"api.tavily.com" "Authorization"'
      - query: '"api.tavily.com" "api_key"'
      - query: '"tvly-" "api.tavily.com"'
      - query: '"tvly-" "Authorization"'
      - query: '"tvly-" "api_key"'
      - query: '"tvly-" "TAVILY"'
      - query: '"tvly-" language:Python'
      - query: '"tvly-" language:JavaScript'
      - query: '"tvly-" language:TypeScript'
      - query: '"tvly-" language:Go'
      - query: '"tvly-" language:Shell'
      - query: '"tvly-" extension:env'
      - query: '"tvly-" extension:json'
      - query: '"tvly-" extension:yaml'
      - query: '"tvly-" extension:yml'
      - query: '"tvly-" extension:toml'
      - query: '"tvly-" extension:md'
      - query: '"tavily-" language:Python'
      - query: '"tavily-" extension:env'
    rate_limit:
      base_rate: 1.0
      burst_limit: 5
      adaptive: true
    storage:
      directory: ""
      plan: ""
