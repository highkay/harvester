name: Release Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute short SHA
        id: ver
        run: |
          set -euo pipefail
          sha7="$(git rev-parse --short=7 HEAD)"
          echo "sha7=${sha7}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/highkay/harvester:latest
            ghcr.io/highkay/harvester:sha-${{ steps.ver.outputs.sha7 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Harvester Release Image"
            echo "- sha: \`${{ steps.ver.outputs.sha7 }}\`"
            echo "- image: \`ghcr.io/highkay/harvester:latest\`"
            echo "- immutable tag: \`ghcr.io/highkay/harvester:sha-${{ steps.ver.outputs.sha7 }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"