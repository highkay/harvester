<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Harvester 管理界面{% endblock %}</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #27273a; --fg: #e6e6ef;
    --muted: #9a9ab0; --accent: #7aa2f7; --border: #3a3a52;
    --ok: #5ac878; --bad: #e65a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 14px;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center;
    gap: 24px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; color: var(--accent); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav a {
    color: var(--muted); text-decoration: none; padding: 5px 10px;
    border-radius: 4px;
  }
  nav a:hover { color: var(--fg); background: var(--border); }
  nav a.active { color: var(--accent); background: rgba(122, 162, 247, .15); }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  h2 { margin-bottom: 16px; font-size: 18px; }
  h3 { margin: 24px 0 8px; font-size: 15px; color: var(--accent); }
  p { margin-bottom: 12px; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 24px; min-width: 150px;
  }
  .card .num { font-size: 28px; font-weight: bold; color: var(--accent); }
  .card .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { background: #2f2f46; color: var(--muted); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  code { background: #2f2f46; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  a { color: var(--accent); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.on { background: rgba(90, 200, 120, .15); color: var(--ok); }
  .tag.off { background: rgba(230, 90, 90, .15); color: var(--bad); }
  .muted { color: var(--muted); }
  form {
    max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    padding: 24px; border-radius: 8px;
  }
  label { display: block; margin-bottom: 8px; color: var(--muted); }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 8px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--fg); margin-bottom: 16px;
  }
  button {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
  }
  button:hover { opacity: .9; }
  .notice {
    background: rgba(122, 162, 247, .12); border: 1px solid var(--accent);
    padding: 10px 12px; border-radius: 6px; margin-top: 12px;
    white-space: pre-wrap; word-break: break-all; max-width: 380px;
  }
  .notice.error { background: rgba(230, 90, 90, .15); border-color: var(--bad); }
  footer {
    padding: 16px 24px; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--border); text-align: center; margin-top: 32px;
  }
</style>
</head>
<body>
<header>
  <h1>Harvester 管理界面</h1>
  <nav>
    <a href="/" {% if page == 'dashboard' %}class="active"{% endif %}>仪表盘</a>
    <a href="/tokens" {% if page == 'tokens' %}class="active"{% endif %}>Token 管理</a>
    <a href="/schedule" {% if page == 'schedule' %}class="active"{% endif %}>调度管理</a>
    <a href="/runs" {% if page == 'runs' %}class="active"{% endif %}>运行历史</a>
    <a href="/push-logs" {% if page == 'push-logs' %}class="active"{% endif %}>推送日志</a>
    <a href="/login" {% if page == 'login' %}class="active"{% endif %}>登录</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Harvester 管理界面 · 纯服务端渲染 · 数据来自本地 SQLite</footer>
</body>
</html>
