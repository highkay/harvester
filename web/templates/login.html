{% extends "base.html" %}
{% block title %}登录 - Harvester 管理界面{% endblock %}
{% block content %}
<h2>登录</h2>
<p class="muted">输入预共享的认证密钥（WEB_AUTH_KEY）以获取访问令牌。令牌需在请求头中携带：<code>Authorization: Bearer &lt;token&gt;</code>。</p>

<form id="login-form">
  <label for="auth_key">认证密钥（auth_key）</label>
  <input type="password" id="auth_key" name="auth_key" placeholder="请输入 WEB_AUTH_KEY" autocomplete="off" required>
  <button type="submit">登录</button>
</form>

<div id="result"></div>

<script>
document.getElementById("login-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const box = document.getElementById("result");
  const key = document.getElementById("auth_key").value;
  box.className = "";
  box.textContent = "登录中…";
  try {
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ auth_key: key }),
    });
    if (resp.ok) {
      const data = await resp.json();
      box.className = "notice";
      box.textContent = "登录成功！访问令牌：\n" + data.token +
        "\n\n调用受保护页面/接口时请携带请求头：\nAuthorization: Bearer <token>";
    } else {
      box.className = "notice error";
      box.textContent = "认证失败（HTTP " + resp.status + "），请检查 WEB_AUTH_KEY 是否正确。";
    }
  } catch (err) {
    box.className = "notice error";
    box.textContent = "请求出错：" + err;
  }
});
</script>
{% endblock %}
